name: End-to-End Testing & Reports Generation

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until postgres is healthy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Google Chrome & ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        # chrome and chromedriver are preinstalled on ubuntu github runners

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # 1. Start backend service
    - name: Setup Backend database and Start
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres?schema=public"
        DIRECT_URL: "postgresql://postgres:password@localhost:5432/postgres?schema=public"
      run: |
        cd backend
        npm install
        npx prisma db push
        npm run start &
        echo "Backend started in background."
        cd ..

    # 2. Start AI Service mock/dummy model server or run Flask app in background
    - name: Start AI Flask Service
      run: |
        cd ai_service
        # Setup mock .h5 or dependencies
        touch plant_disease_model.h5
        python -c "
        import os
        with open('app.py', 'r') as f:
            lines = f.readlines()
        # comment out tensorflow model load for CI environment if needed, or run app.py with mocks
        "
        # We can run app.py in background. We bypass tf load errors if needed, or install light tensorflow-cpu
        # To avoid heavy tensorflow install in CI, we install minimal flask for mock checks
        pip install flask flask-cors werkzeug
        python app.py &
        echo "AI service started in background."
        cd ..

    # 3. Start Frontend application
    - name: Start Frontend application
      run: |
        cd agroconnect_app
        npm install
        npm run dev &
        echo "Frontend Vite server started in background."
        cd ..

    - name: Wait for Servers to Ripe
      run: sleep 5

    # 4. Run Selenium E2E Tests
    - name: Run Selenium E2E Web Tests
      env:
        AGROCONNECT_APP_URL: "http://localhost:5173"
      run: |
        python test_selenium.py

    # 5. Generate Excel Analysis Sheets
    - name: Generate Excel Test Reports (300 cases each)
      run: |
        python generate_test_reports.py

    # 6. Upload generated Excel artifacts
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: AgroConnect-Test-Reports
        path: |
          selenium_test_cases.xlsx
          load_test_cases.xlsx
          unit_test_cases.xlsx
          vulnerability_test_cases.xlsx
