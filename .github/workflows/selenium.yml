name: Selenium Mock Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-mock-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl
        
    - name: Run Mock Selenium Tests
      run: |
        python generate_mock_selenium_tests.py
        
    - name: Upload Excel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: selenium-mock-test-results
        path: selenium_mock_results.xlsx
